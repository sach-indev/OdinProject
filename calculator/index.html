<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="logic.js" defer></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="calculator-title">
        <div class="container">
            <h1>CALCULATOR</h1>
        </div>
        <hr>
    </div>

    <div class="calculator">
        
        <div class="container">
            <div class="view-container">
                <div class="view">
                    00000000000
                </div>
            </div>

            <div class="row">
                <button id="reset">AC</button>
                <button class="special-op">&radic;</button>
                <button class="special-op">%</button>
                <button class="basic-op">&divide;</button>
            </div>

            <div class="row">
                <button class="digit">7</button>
                <button class="digit">8</button>
                <button class="digit">9</button>
                <button class="basic-op">&times;</button>
            </div>

            <div class="row">
                <button class="digit">4</button>
                <button class="digit">5</button>
                <button class="digit">6</button>
                <button class="basic-op">&minus;</button>
            </div>

            <div class="row">
                <button class="digit">1</button>
                <button class="digit">2</button>
                <button class="digit">3</button>
                <button class="basic-op">+</button>
            </div>

            <div class="row">
                <button class="digit">0</button>
                <button class="special-op">.</button>
                <button class="special-op">&plusmn;</button>
                <button class="basic-op">=</button>
            </div>
        </div>

    </div>
</body>
</html>
